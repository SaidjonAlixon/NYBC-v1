kind = "web"
previewPath = "/"
title = "American Truck Logistics"
version = "1.0.0"
id = "artifacts/truck-logistics"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24853

[services.development]
run = "pnpm --filter @workspace/truck-logistics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/truck-logistics", "run", "build" ]
publicDir = "artifacts/truck-logistics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24853"
BASE_PATH = "/"
